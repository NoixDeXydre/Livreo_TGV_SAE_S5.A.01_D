name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # API Spring Boot (api-spring/)
  # ---------------------------------------------------------------
  api:
    name: API - compilation et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-spring

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/Livreo-db

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      # L'API n'est présente que sur les branches qui l'embarquent
      - name: Installation de Java 21
        if: hashFiles('api-spring/pom.xml') != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api-spring/pom.xml

      # mvnw est versionné sans le droit d'exécution
      - name: Compilation et tests
        if: hashFiles('api-spring/pom.xml') != ''
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  # ---------------------------------------------------------------
  # Application mobile (Android/)
  # ---------------------------------------------------------------
  mobile:
    name: Mobile - tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      # Le daemon Gradle exige un JDK 25 (gradle-daemon-jvm.properties)
      - name: Installation de Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            Android/**/*.gradle*
            Android/**/gradle-wrapper.properties
            Android/gradle/libs.versions.toml

      # gradlew est versionné sans le droit d'exécution
      - name: Tests unitaires
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-mobile
          path: Android/app/build/reports/tests/

  # ---------------------------------------------------------------
  # Site web (Site/)
  # ---------------------------------------------------------------
  site:
    name: Site - syntaxe PHP
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Vérification de la syntaxe
        if: hashFiles('Site/**/*.php') != ''
        run: find Site -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
